<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Noite dos Objetos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one arcade screen centered on a night background; touch controls dock below it on phones */
:root{
  --night:#0c0a18;
  --screen:#07060f;
  --ink:#f4ead2;
  --lamp:#ffc85a;
  --soul:#ff4f6d;
  --dim:#7d7499;
  --f-display:'Silkscreen','Courier New',monospace;
  --f-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:20px;
  box-sizing:border-box;min-height:100%;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;
}
.stage{width:100%;max-width:820px}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;background:var(--screen);border-radius:6px;touch-action:none;outline:none;box-shadow:0 0 0 2px #1d1833,0 18px 60px rgba(0,0,0,.55)}
canvas:focus-visible{box-shadow:0 0 0 2px var(--lamp)}
.bar{width:100%;max-width:820px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;color:var(--dim);font-size:19px;line-height:1.2}
.bar b{color:var(--ink);font-weight:400}
.mute{font-family:var(--f-body);font-size:19px;background:transparent;color:var(--ink);border:2px solid var(--dim);border-radius:4px;padding:2px 12px;cursor:pointer}
.mute:hover,.mute:focus-visible{border-color:var(--lamp);color:var(--lamp);outline:none}
.pad{display:none;width:100%;max-width:820px;justify-content:space-between;align-items:center;gap:16px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
.pad button{font-family:var(--f-display);font-size:18px;color:var(--ink);background:#1a1530;border:2px solid #3a3160;border-radius:8px;touch-action:none;-webkit-tap-highlight-color:transparent}
.pad button:active,.pad button.on{background:var(--lamp);color:#1a1205;border-color:var(--lamp)}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.ab{display:flex;gap:14px;align-items:center}
.ab button{width:74px;height:74px;border-radius:50%}
.ab .ok{border-color:var(--soul)}
.keys-touch{display:none}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}.keys-touch{display:inline}}
</style>
</head><body>

<div class="stage">
  <canvas id="game" width="640" height="480" tabindex="0" aria-label="Jogo de batalha por turnos. Use as setas para mover, Z para confirmar e X para voltar."></canvas>
</div>
<div class="pad" id="pad">
  <div class="dpad">
    <button class="u" data-k="up" aria-label="Cima">▲</button>
    <button class="l" data-k="left" aria-label="Esquerda">◀</button>
    <button class="r" data-k="right" aria-label="Direita">▶</button>
    <button class="d" data-k="down" aria-label="Baixo">▼</button>
  </div>
  <div class="ab">
    <button data-k="back" aria-label="Voltar">X</button>
    <button class="ok" data-k="ok" aria-label="Confirmar">Z</button>
  </div>
</div>
<div class="bar">
  <span class="keys"><b>Setas/WASD</b> mover · <b>Z/Enter</b> confirmar · <b>X/Esc</b> voltar · <b>M</b> som</span>
  <span class="keys-touch">No celular: toque nos botões ou arraste o dedo dentro da caixa para desviar.</span>
  <button class="mute" id="mute" type="button">Som: ligado</button>
</div>

<script>
(() => {
'use strict';
const W = 640, H = 480;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const FONT = '"VT323", "Courier New", monospace';
const FONT_D = '"Silkscreen", "Courier New", monospace';
const C = {
  bg:'#07060f', ink:'#f4ead2', lamp:'#ffc85a', soul:'#ff4f6d', spare:'#ffe14d', dim:'#7d7499',
  blue:'#4fb8ff', orange:'#ff9a3c', hp:'#c8f05a', hpBack:'#6e1c2c', jump:'#5affb0', violet:'#b48cff'
};

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
function distSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

/* ---------- input ---------- */
const keys = {}, pressed = {};
const KEYMAP = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  KeyZ:'ok', Enter:'ok', Space:'ok', NumpadEnter:'ok', KeyX:'back', Escape:'back', Backspace:'back', KeyM:'mute' };
function press(k) { initAudio(); if (!keys[k]) pressed[k] = true; keys[k] = true; }
function release(k) { keys[k] = false; }
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); if (e.repeat && (k === 'ok' || k === 'back')) return; press(k); });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) release(k); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function hit(k) { if (pressed[k]) { pressed[k] = false; return true; } return false; }

const ptr = { down:false, x:0, y:0, tap:null, hover:null };
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => { initAudio(); const p = toLocal(e); ptr.down = true; ptr.x = p.x; ptr.y = p.y; ptr.tap = p; try { cv.setPointerCapture(e.pointerId); } catch (_) {} cv.focus(); e.preventDefault(); });
cv.addEventListener('pointermove', e => { const p = toLocal(e); ptr.x = p.x; ptr.y = p.y; if (e.pointerType === 'mouse') ptr.hover = p; });
cv.addEventListener('pointerup', () => { ptr.down = false; });
cv.addEventListener('pointercancel', () => { ptr.down = false; });
function takeTap() { const t = ptr.tap; ptr.tap = null; return t; }
const inRect = (p, r) => p && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.classList.add('on'); press(k); };
  const off = e => { e.preventDefault(); b.classList.remove('on'); release(k); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointerleave', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- audio ---------- */
let ac = null, muted = false;
try { muted = localStorage.getItem('noite-mute') === '1'; } catch (_) {}
const muteBtn = document.getElementById('mute');
function syncMute() { muteBtn.textContent = 'Som: ' + (muted ? 'desligado' : 'ligado'); }
syncMute();
function toggleMute() { muted = !muted; syncMute(); try { localStorage.setItem('noite-mute', muted ? '1' : '0'); } catch (_) {} }
muteBtn.addEventListener('click', () => { initAudio(); toggleMute(); cv.focus(); });
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { ac = null; }
}
function beep(f, d, type = 'square', vol = 0.05, slide = 0, delay = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
const sfx = {
  move: () => beep(520, 0.04, 'square', 0.035),
  select: () => { beep(660, 0.05); beep(990, 0.07, 'square', 0.04, 0, 0.05); },
  back: () => beep(330, 0.06, 'square', 0.035),
  error: () => beep(140, 0.15, 'square', 0.05),
  text: () => beep(rand(260, 300), 0.025, 'square', 0.018),
  talk: () => beep(rand(140, 190), 0.03, 'triangle', 0.05),
  slash: () => beep(900, 0.18, 'sawtooth', 0.05, -700),
  hitEnemy: () => { beep(110, 0.25, 'square', 0.09, -60); beep(70, 0.3, 'triangle', 0.08, 0, 0.05); },
  miss: () => beep(400, 0.2, 'triangle', 0.05, -250),
  hurt: () => { beep(200, 0.2, 'sawtooth', 0.08, -140); },
  heal: () => { beep(523, 0.08); beep(659, 0.08, 'square', 0.05, 0, 0.08); beep(784, 0.14, 'square', 0.05, 0, 0.16); },
  spareReady: () => { beep(784, 0.1, 'triangle', 0.07); beep(1046, 0.18, 'triangle', 0.07, 0, 0.1); },
  spare: () => { [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.18, 'triangle', 0.07, 0, i * 0.09)); },
  dust: () => beep(300, 0.8, 'sawtooth', 0.05, -260),
  lvup: () => { [392, 523, 659, 784].forEach((f, i) => beep(f, 0.12, 'square', 0.05, 0, i * 0.08)); },
  break: () => { beep(500, 0.08, 'square', 0.08, -200); beep(120, 0.5, 'sawtooth', 0.07, -60, 0.6); },
  flee: () => { [700, 600, 500, 400].forEach((f, i) => beep(f, 0.06, 'square', 0.04, 0, i * 0.05)); },
  warn: () => beep(880, 0.04, 'square', 0.025),
  stamp: () => beep(90, 0.15, 'square', 0.08, -40)
};

/* ---------- player & items ---------- */
const LV_EXP = [0, 0, 10, 30, 60, 999999];
const P = { lv:1, exp:0, hp:20, maxhp:20, atk:5, inv:[], fast:false };

function heal(n, line) {
  const before = P.hp; P.hp = Math.min(P.maxhp, P.hp + n); sfx.heal();
  return { text:[line, P.hp >= P.maxhp ? '* Seu HP está no máximo!' : `* Você recuperou ${P.hp - before} HP.`] };
}
const FORTUNES = [
  '"Um grampo no caminho vale dois na gaveta."',
  '"A luz que você procura está na tomada."',
  '"Hoje é um ótimo dia para não virar torrada."',
  '"Quem desvia por último desvia melhor."'
];
const ITEMS = {
  choc:  { name:'Chocolate Morno', desc:'+10 HP. Derreteu um pouquinho.', use: () => heal(10, '* Você comeu o Chocolate Morno. Grudou nos dedos.') },
  refri: { name:'Refri Sem Gás',  desc:'+5 HP. Pelo menos é doce.',     use: () => heal(5, '* Você bebeu o Refri Sem Gás. Triste, mas doce.') },
  vela:  { name:'Vela Misteriosa', desc:'Efeito desconhecido...',
    use: m => {
      if (m && m.def.id === 'abaj' && m.state === 'alive') {
        return { text:['* Você acende a Vela Misteriosa e a coloca ao lado do Abajurino.', '* Agora ele não está mais sozinho contra o escuro.'], sat:50,
          reply:'U-uma amiga luminosa! E ela nem pisca!' };
      }
      return heal(12, '* Você acendeu a Vela Misteriosa. O calorzinho te conforta.');
    } },
  pao:   { name:'Pão de Queijo',  desc:'+15 HP. Ainda quentinho.',      use: () => heal(15, '* Você comeu o Pão de Queijo. Fofinho por dentro!') },
  cafe:  { name:'Café Requentado', desc:'+8 HP e você fica mais rápido no próximo desvio.',
    use: () => { const r = heal(8, '* Você bebeu o Café Requentado. Amargo... mas acorda.'); P.fast = true; r.text.push('* Você se sente ligeiro! (Mais rápido no próximo ataque)'); return r; } },
  bisc:  { name:'Biscoito da Sorte', desc:'+6 HP e uma previsão.',
    use: () => { const r = heal(6, '* Você abriu o Biscoito da Sorte. O papel diz:'); r.text.splice(1, 0, '* ' + pick(FORTUNES)); return r; } }
};
const ITEM_LIMIT = 8;

/* ---------- monsters ---------- */
const MONSTERS = [
{
  id:'abaj', name:'ABAJURINO', maxhp:40, atk:3, exp:10, he:true, moods:['Apavorado', 'Desconfiado', 'Tranquilo', 'Satisfeito'],

  check:'* ABAJURINO - ATQ 3  DEF 2\n* Tem pavor do escuro. Mas ele é a única luz da sala.',
  flavor:['* Abajurino tremelica.', '* Cheiro de poeira queimada.', '* Uma mariposa pousou na cúpula. Abajurino choraminga.', '* A luz pisca. Abajurino prende a respiração.'],
  low:'* A luz do Abajurino está fraquinha...',

  ],

      if (m.flags.elogio > 2) return { text:['* Você elogia a luz dele de novo.', '* Ele já está ficando meio convencido.'], sat:5, reply:'Eu sei, eu sei. Sou um arraso.' };
      return { text:['* Você diz que a luz dele é aconchegante.', '* Abajurino brilha um pouquinho mais forte.'], sat:25, reply:'V-você acha? É só uma lâmpada de 40 watts...' };

          : { text:['* Você faz uma sombra de coelho na parede.', '* Abajurino ri tanto que a cúpula balança!'], sat:30, reply:'HAHA! Eu que fiz essa sombra! Eu sou um ARTISTA!' }; }

{

  ]
},

function resolveFight(missed) {
  const fb = fightBar; fb.stopped = true; fb.t = 0;
  const half = (BOX_MENU.w - 40) / 2;
  const dist = Math.abs(fb.x - half) / half;
  if (missed || dist > 0.94) {
    fb.res = { miss:true }; sfx.miss();
    M.dmg = { text:'ERROU', t:0, color:C.dim };
    return;
  }
  const crit = dist < 0.06;
  const mult = crit ? 2.2 : 0.35 + (1 - dist) * 1.45;
  const dmg = Math.max(1, Math.round((P.atk + rand(0, 2)) * mult));
  fb.res = { dmg, crit };
  sfx.slash(); M.slash = 0.45;
  setTimeout(() => { if (!M) return; sfx.hitEnemy(); M.hp = Math.max(0, M.hp - dmg); M.shake = 0.6; M.dmg = { text:(crit ? 'CRÍTICO! ' : '') + dmg, t:0, color: crit ? C.spare : C.soul }; }, 380);
}
function afterFight() {
  const fb = fightBar; fightBar = null;
  if (fb.res.miss) { M.reply = M.def.missLine; enemyTurn(); return; }
  if (M.hp <= 0) {
    M.state = 'dying'; sfx.dust();
    const lines = [M.def.killLine, `* VOCÊ VENCEU! Ganhou ${M.def.exp} EXP.`];
    P.exp += M.def.exp;
    while (P.lv < LV_EXP.length - 2 && P.exp >= LV_EXP[P.lv + 1]) {
      P.lv++; P.maxhp += 4; P.hp += 4; P.atk += 2;
      lines.push(`* Seu LV subiu para ${P.lv}! HP máximo e ataque aumentaram.`);
      setTimeout(sfx.lvup, 900);
    }
    say(lines, () => endBattle('derrotado'));
    return;
  }
  M.turn++;
  M.anger = clamp(M.anger + 1, 0, 3);
  const was = M.sat;
  M.sat = clamp(M.sat - 10, 0, 100);
  if (was !== M.sat) fx.push({ text:'-' + (was - M.sat) + '%', x:106, y:136, t:0, color:C.soul });
  M.reply = pick(M.def.hurt);
  enemyTurn();
}

    return (cx - soul.x) ** 2 + (cy - soul.y) ** 2 < sr * sr;
  }
  if (bl.shape === 'seg') return distSeg(soul.x, soul.y, bl.x, bl.y, bl.x + Math.cos(bl.a) * bl.len, bl.y + Math.sin(bl.a) * bl.len) < bl.thick / 2 + sr;
  return false;
}

function updateDodge(dt) {
  const d = dodge;
  d.t += dt;
  // soul movement
  let ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let iy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  let ptrJump = false;
  if (ptr.down && inRect(ptr, { x:box.x - 60, y:box.y - 60, w:box.w + 120, h:box.h + 120 })) {
    const dx = ptr.x - soul.x, dy = ptr.y - soul.y, dl = Math.hypot(dx, dy);
    if (dl > 4) { ix = dx / dl * Math.min(1, dl / 20); iy = dy / dl * Math.min(1, dl / 20); }
    ptrJump = dy < -18;
  }
  const spd = (P.fast ? 195 : 150);
  const ox = soul.x, oy = soul.y;
  const L = box.x + 8, R = box.x + box.w - 8, Tp = box.y + 8, Bt = box.y + box.h - 8;
  if (soul.mode === 'jump') {
    soul.x += ix * spd * dt;
    const wantJump = keys.up || ptrJump;
    if (wantJump && soul.ground) { soul.vy = -340; soul.ground = false; }
    soul.vy += (soul.vy < 0 && !wantJump ? 2100 : 950) * dt;
    soul.y += soul.vy * dt;
    if (soul.y >= Bt) { soul.y = Bt; soul.vy = 0; soul.ground = true; }
    if (soul.y < Tp) { soul.y = Tp; soul.vy = Math.max(0, soul.vy); }
  } else {
    const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
    soul.x += ix * spd * dt; soul.y += iy * spd * dt;
  }
  soul.x = clamp(soul.x, L, R); soul.y = clamp(soul.y, Tp, Bt);
  soul.moving = Math.hypot(soul.x - ox, soul.y - oy) > 0.25;
  if (soul.iframe > 0) soul.iframe -= dt;

  if (d.t < d.wait) return;
  if (!d.setupDone) { d.setupDone = true; d.pat.setup && d.pat.setup(d); }
  const pt = d.t - d.wait;
  d.pat.tick(d, dt);
  for (const bl of bullets) {
    bl.t += dt;
    if (bl.shape === 'seg' && bl.t > bl.warn) bl.a += bl.spd * d.rate * dt * (bl.t < bl.warn + 1 ? (bl.t - bl.warn) : 1);
    bl.vy += bl.g * dt;
    bl.x += bl.vx * dt; bl.y += bl.vy * dt;
    if (bl.upd) bl.upd(bl, dt);
    if (bl.t > bl.life) bl.dead = true;
    const m = 120;
    if (bl.x < box.x - m || bl.x > box.x + box.w + m || bl.y < box.y - m - 60 || bl.y > box.y + box.h + m) bl.dead = true;
    if (scene !== 'dodge') return;
    if (bl.warn && bl.t < bl.warn) continue;
    if (bl.draw === drawStamp && bl.t > bl.warn + 0.28) continue;
    if (bl.kind === 'blue' && !soul.moving) continue;
    if (bl.kind === 'orange' && soul.moving) continue;
    if (collide(bl)) { damagePlayer(bl); if (scene !== 'dodge') return; }
  }
  bullets = bullets.filter(b => !b.dead);
  if (pt >= d.dur) endDodge();
}

/* ---------- update ---------- */
function update(dt) {
  T += dt;
  if (hit('mute')) toggleMute();
  for (const k in box) box[k] = lerp(box[k], boxT[k], Math.min(1, dt * 12));
  if (shakeT > 0) shakeT -= dt;
  fx.forEach(f => f.t += dt); fx = fx.filter(f => f.t < 1.1);
  if (M) {
    if (fadeIn > 0) fadeIn = Math.max(0, fadeIn - dt * 1.5);
    if (M.state === 'alive') M.alpha = 1 - fadeIn;
    else if (M.state === 'dying') M.alpha = Math.max(0, M.alpha - dt * 0.9);
    else if (M.state === 'spared') M.alpha = Math.max(0.35, M.alpha - dt * 1.2);
    else if (M.state === 'fled') M.alpha = Math.max(0, M.alpha - dt * 2);
    if (M.shake > 0) M.shake -= dt;
    if (M.slash > 0) M.slash -= dt;
    if (M.dmg) { M.dmg.t += dt; if (M.dmg.t > 1.2) M.dmg = null; }
    M.hpShown = lerp(M.hpShown, M.hp, Math.min(1, dt * 5));
  }
  const tap = takeTap();

  switch (scene) {
    case 'title':
      if (hit('ok') || tap) { sfx.select(); startGame(); }
      break;
    case 'text': {
      const line = TQ.lines[TQ.i];
      TQ.len = line.length;
      if (TQ.shown < line.length) typeTick(TQ, dt, 46, sfx.text);
      if (hit('ok') || tap) {
        if (TQ.shown < line.length) TQ.shown = line.length;
        else { TQ.i++; TQ.shown = 0; if (TQ.i >= TQ.lines.length) { const cb = TQ.cb; TQ = null; cb && cb(); } }
      }
      if (hit('back') && TQ && TQ.shown < TQ.lines[TQ.i].length) TQ.shown = TQ.lines[TQ.i].length;
      break;
    }
    case 'menu': {
      flavor.len = flavor.text.length;
      if (flavor.shown < flavor.text.length) typeTick(flavor, dt, 50, sfx.text);
      if (hit('left')) { menuSel = (menuSel + 3) % 4; sfx.move(); }
      if (hit('right')) { menuSel = (menuSel + 1) % 4; sfx.move(); }
      if (ptr.hover) { for (let i = 0; i < 4; i++) if (inRect(ptr.hover, btnRect(i)) && menuSel !== i) { menuSel = i; sfx.move(); } ptr.hover = null; }
      if (tap) { for (let i = 0; i < 4; i++) if (inRect(tap, btnRect(i))) { chooseButton(i); break; } }
      else if (hit('ok')) chooseButton(menuSel);
      break;
    }
    case 'sub': {
      const n = sub.items.length;
      if (hit('left') && subSel % 2 === 1) { subSel--; sfx.move(); }
      if (hit('right') && subSel % 2 === 0 && subSel + 1 < n) { subSel++; sfx.move(); }
      if (hit('up') && subSel - 2 >= 0) { subSel -= 2; sfx.move(); }
      if (hit('down') && subSel + 2 < n) { subSel += 2; sfx.move(); }
      if (ptr.hover) { for (let i = 0; i < n; i++) if (inRect(ptr.hover, subRect(i)) && subSel !== i) { subSel = i; sfx.move(); } ptr.hover = null; }
      if (hit('back')) { backToMenu(); break; }
      if (tap) {
        if (inRect(tap, BACK_RECT)) { backToMenu(); break; }
        for (let i = 0; i < n; i++) if (inRect(tap, subRect(i))) { subSel = i; sfx.select(); sub.items[i].run(); return; }
        for (let i = 0; i < 4; i++) if (inRect(tap, btnRect(i))) { chooseButton(i); break; }
        break;
      }
      if (hit('ok')) { sfx.select(); sub.items[subSel].run(); }
      break;
    }
    case 'fight': {
      const fb = fightBar;
      const width = BOX_MENU.w - 40;
      if (!fb.stopped) {
        fb.x += fb.speed * dt;
        if (hit('ok') || tap) resolveFight(false);
        else if (hit('back')) { fightBar = null; backToMenu(); }
        else if (fb.x >= width) { fb.x = width; resolveFight(true); }
      } else {
        fb.t += dt;
        if (fb.t > (fb.res.miss ? 0.9 : 1.5)) afterFight();
      }
      break;
    }
    case 'talk': {
      talk.len = talk.text.length;
      if (talk.shown < talk.text.length) typeTick(talk, dt, 34, sfx.talk);
      if (hit('ok') || tap) {
        if (talk.shown < talk.text.length) talk.shown = talk.text.length;
        else { talk = null; startDodge(); }
      }
      break;
    }
    case 'dodge':
      updateDodge(dt);
      break;
    case 'gameover':
      go.t += dt;
      if (go.t > 0.7 && !go.broke) {
        go.broke = true;
        for (let i = 0; i < 7; i++) go.shards.push({ x:go.x, y:go.y, vx:rand(-120, 120), vy:rand(-220, -60), a:rand(0, 6) });
      }
      go.shards.forEach(s => { s.vy += 420 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.a += dt * 6; });
      if (go.t > 2.2 && (hit('ok') || tap)) {
        sfx.select();
        Object.assign(P, snapshot, { inv:snapshot.inv.slice(), fast:false });
        P.hp = P.maxhp;
        startBattle(battleIdx);
      }
      break;
    case 'ending':
      endT += dt;
      if (endT > 1 && (hit('ok') || tap)) { sfx.select(); scene = 'title'; }
      break;
  }
}

/* ---------- drawing: shared ---------- */
function text(s, x, y, size = 24, color = C.ink, align = 'left', font = FONT) {
  ctx.font = `${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size = 26, font = FONT) {
  ctx.font = `${size}px ${font}`;
  const out = [];
  for (const para of s.split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
    }

  return out;
}
function typed(s, shown, x, y, maxW, size = 26, lh = 30, color = C.ink) {
  const lines = wrap(s, maxW, size);
  let left = Math.floor(shown);
  ctx.fillStyle = color; ctx.textAlign = 'left';
  for (let i = 0; i < lines.length && left > 0; i++) {

    left -= lines[i].length + 1;

}
function heart(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 16, s / 16);
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-2, 3, -8, 1, -8, -3);

  ctx.restore();
}

function drawBox() {

function drawFightBar() {

function drawDodge() {

  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, r1 = 66, r2 = 74; ctx.beginPath(); ctx.moveTo(b.x + Math.cos(a) * r1, b.y + Math.sin(a) * r1); ctx.lineTo(b.x + Math.cos(a) * r2, b.y + Math.sin(a) * r2); ctx.stroke(); }
  ctx.fillStyle = b.t < b.warn ? 'rgba(244,234,210,.4)' : C.ink; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
}
function drawStamp(b) {
  if (b.t < b.warn) {
    const k = b.t / b.warn;
    ctx.fillStyle = `rgba(217,83,79,${0.12 + k * 0.25})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.5 + k * 0.5), 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(217,83,79,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
    return;
  }
  if (!b.stamped) { b.stamped = true; sfx.stamp(); shakeT = Math.max(shakeT, 0.08); }
  const fade = clamp(1 - (b.t - b.warn - 0.25) / 0.15, 0, 1);
  ctx.globalAlpha = fade;

  ctx.fillStyle = '#d9534f'; ctx.fillRect(b.x - 20, b.y - 20, 40, 40);

function eyesLook() { const tx = scene === 'dodge' ? soul.x : 320 + Math.sin(T * 0.7) * 40, ty = scene === 'dodge' ? soul.y : 300; return { tx, ty }; }
function drawEye(x, y, rx, ry, pr, scared) {
  const { tx, ty } = eyesLook();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1b1430'; ctx.lineWidth = 2; ctx.stroke();
  const a = Math.atan2(ty - y, tx - x), off = Math.min(rx, ry) - pr - 1;
  const jx = scared ? rand(-0.8, 0.8) : 0;
  ctx.fillStyle = '#1b1430'; ctx.beginPath(); ctx.arc(x + Math.cos(a) * off + jx, y + Math.sin(a) * off, pr, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + Math.cos(a) * off + jx - 1.2, y + Math.sin(a) * off - 1.2, pr * 0.35, 0, 7); ctx.fill();
}

function drawAbajurino(m) {
  const cx = 320, by = 208, bob = Math.sin(T * 2.4) * 3;
  const fear = m.state === 'alive' ? 1 - m.sat / 100 : 0;
  const tr = fear > 0.3 && !reduceMotion ? rand(-1, 1) * fear * 1.6 : 0;
  const lit = m.state === 'dying' ? 0.2 : (Math.random() < 0.05 * fear ? 0.35 : 1);
  ctx.save(); ctx.translate(tr, 0);
  const g = ctx.createRadialGradient(cx, 128 + bob, 10, cx, 128 + bob, 150);
  g.addColorStop(0, `rgba(255,200,90,${0.38 * lit})`); g.addColorStop(1, 'rgba(255,200,90,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - 160, 0, 320, 230);
  // base
  ctx.fillStyle = '#3a2a4a'; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, by, 48, 10, 0, 0, 7); ctx.fill(); ctx.stroke();
  // stem & arms
  ctx.strokeStyle = '#c9b89a'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(cx, by - 6); ctx.lineTo(cx, 128 + bob); ctx.stroke();
  ctx.lineWidth = 4; ctx.strokeStyle = C.ink;
  const armUp = m.sat >= 100 ? -18 : 0, wig = Math.sin(T * 9) * 4 * fear;
  ctx.beginPath(); ctx.moveTo(cx, 168 + bob); ctx.quadraticCurveTo(cx - 20, 160 + bob, cx - 34, 150 + bob + armUp + wig); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, 168 + bob); ctx.quadraticCurveTo(cx + 20, 160 + bob, cx + 34, 150 + bob + armUp - wig); ctx.stroke();
  // bulb
  ctx.fillStyle = lit > 0.5 ? '#fff1c2' : '#6d6050';
  ctx.beginPath(); ctx.arc(cx, 132 + bob, 15, 0, 7); ctx.fill();
  // shade
  const top = 44 + bob, bot = 122 + bob;
  ctx.fillStyle = '#f1d9a6'; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - 40, top); ctx.lineTo(cx + 40, top); ctx.lineTo(cx + 76, bot); ctx.lineTo(cx - 76, bot); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(160,110,60,.35)'; ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(cx + i * 16, top + 2); ctx.lineTo(cx + i * 30, bot - 2); ctx.stroke(); }
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  for (let i = -70; i <= 70; i += 10) { const sw = Math.sin(T * 3 + i) * 2; ctx.beginPath(); ctx.moveTo(cx + i, bot); ctx.lineTo(cx + i + sw, bot + 8); ctx.stroke(); }
  // face

  drawEye(cx + 22, ey, 11, 13, fear > 0.5 ? 3 : 4.5, fear > 0.5);
  ctx.strokeStyle = '#1b1430'; ctx.lineWidth = 3;
  if (fear > 0.35) { ctx.beginPath(); ctx.moveTo(cx - 32, ey - 20); ctx.lineTo(cx - 12, ey - 15); ctx.moveTo(cx + 32, ey - 20); ctx.lineTo(cx + 12, ey - 15); ctx.stroke(); }
  ctx.beginPath();
  if (m.sat >= 100) { ctx.arc(cx, ey + 14, 10, 0.15 * Math.PI, 0.85 * Math.PI); }
  else if (m.sat >= 50) { ctx.ellipse(cx, ey + 22, 5, 4, 0, 0, 7); }
  else { for (let i = 0; i <= 6; i++) { const xx = cx - 12 + i * 4, yy = ey + 22 + (i % 2 ? -3 : 3); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } }
  ctx.stroke();
  if (m.flags && m.flags.vela) {}
  ctx.restore();
}

function drawGrampo(m) {

  ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(-226, -36, 220, 8, 4); ctx.fill();
  // glasses + eyes

function drawMonster() {
  if (!M) return;
  ctx.save();

  ctx.restore();

}

  if (shakeT > 0 && !reduceMotion) ctx.translate(rand(-3, 3), rand(-3, 3));
  ctx.fillStyle = C.bg; ctx.fillRect(-10, -10, W + 20, H + 20);
  if (scene === 'title') drawTitle();
  else if (scene === 'gameover') drawGameOver();
  else if (scene === 'ending') drawEnding();
  else {
    if (!M) {
      ctx.fillStyle = 'rgba(244,234,210,.06)';
      for (let i = 0; i < 9; i++) ctx.fillRect(60 + i * 64, 120 + Math.sin(T + i) * 4, 2, 60);
      text(`Caminho para a batalha ${battleIdx + 2} de ${MONSTERS.length}`, 320, 90, 26, C.dim, 'center');
    }
    drawMonster();
    drawPanel();
    drawBox();
    drawBoxContent();
    drawStats();
    drawButtons();
    drawBubble();
    drawFx();
  }
  ctx.restore();
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { update(dt); draw(); } catch (err) { console.error(err); }
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { get scene() { return scene; }, get M() { return M; }, P, get results() { return results; } };
})();
</script>
