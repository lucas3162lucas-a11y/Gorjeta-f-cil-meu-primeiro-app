<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — ZapVendas IA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap"><a class="logo" href="/">ZapVendas <span>IA</span></a></div>
  </header>

  <main class="wrap">
    <div class="card auth">
      <h2 id="title">Entrar</h2>
      <form id="form">
        <div id="name-field" class="hidden">
          <label for="name">Seu nome ou da empresa</label>
          <input id="name" autocomplete="name">
        </div>
        <label for="email">E-mail</label>
        <input id="email" type="email" required autocomplete="email">
        <div class="hint" id="email-hint"></div>
        <label for="password">Senha</label>
        <input id="password" type="password" required minlength="6" autocomplete="current-password">
        <div class="error" id="error"></div>
        <button class="btn" style="width:100%" id="submit">Entrar</button>
      </form>
      <p style="text-align:center;margin-bottom:0">
        <a href="#" id="toggle">Não tem conta? Cadastre-se</a>
      </p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const plan = params.get('plano');
    let signup = params.get('cadastro') === '1';
    const $ = (id) => document.getElementById(id);

    function render() {
      $('title').textContent = signup ? 'Criar conta' : 'Entrar';
      $('submit').textContent = signup ? 'Criar conta e assinar' : 'Entrar';
      $('name-field').classList.toggle('hidden', !signup);
      $('toggle').textContent = signup ? 'Já tem conta? Entrar' : 'Não tem conta? Cadastre-se';
      $('email-hint').textContent = signup ? 'Use o mesmo e-mail no pagamento.' : '';
      $('password').autocomplete = signup ? 'new-password' : 'current-password';
    }
    render();

    $('toggle').onclick = (e) => { e.preventDefault(); signup = !signup; render(); };

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      $('error').textContent = '';
      $('submit').disabled = true;
      const body = { email: $('email').value, password: $('password').value, name: $('name').value, plan };
      const res = await fetch(signup ? '/api/cadastro' : '/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      $('submit').disabled = false;
      if (!res.ok) return ($('error').textContent = data.error || 'Erro, tente de novo');
      location.href = plan ? `/painel?assinar=${plan}` : '/painel';
    };
  </script>
</body>
</html>
