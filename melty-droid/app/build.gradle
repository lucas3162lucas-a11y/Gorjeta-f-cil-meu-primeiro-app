plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meltydroid.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meltydroid.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug para dar para instalar direto. Para publicar na Play Store,
            // troque por uma chave sua (signingConfigs).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
